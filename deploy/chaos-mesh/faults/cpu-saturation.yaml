# StressChaos template for the cpu_saturation fault type. Placeholders
# ({{NAME}}, {{TARGET_SERVICE}}, {{DURATION}}, {{WORKERS}}, {{LOAD}}) are
# substituted by scripts/run-attended.py (fault_manifest.render) from
# campaigns/<id>/fault-params.yaml, not hand-edited per run.
#
# Calibration r01 (SETUP-REVIEW 7.14): workers=1, load=100 throttled
# checkoutservice (500m limit) in 91 % of periods but used only ~0.3 core and
# caused no user impact. Draft value since 7.15: workers=4, load=100.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: "{{NAME}}"
  namespace: sentrix
spec:
  mode: one
  selector:
    namespaces:
      - sentrix
    labelSelectors:
      app: "{{TARGET_SERVICE}}"
  stressors:
    cpu:
      workers: {{WORKERS}}
      load: {{LOAD}}
  duration: "{{DURATION}}"
