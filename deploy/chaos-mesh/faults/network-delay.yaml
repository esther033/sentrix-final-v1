# NetworkChaos delay template -- dependency_edge scope (source service ->
# target service), per sentrix-project-context.md section 7 layer model
# (L3/L4 injection, observed as L7 span latency/timeout).
# {{NAME}}, {{SOURCE_SERVICE}}, {{TARGET_SERVICE}}, {{LATENCY}}, {{JITTER}}, {{DURATION}}, {{TARGET_SERVICE_CLUSTER_IP}}
# Method A (SETUP-REVIEW 7.15): callers dial the destination Service name and
# kube-proxy (iptables) DNATs ClusterIP -> pod IP after this pod's egress tc,
# so the pod-IP target alone never matches app traffic. externalTargets adds
# the destination ClusterIP (looked up by run-attended.py at injection time);
# the pod-IP target stays for direct pod-IP traffic.
# correlation "0" (SETUP-REVIEW 7.18): kernel 7.0 netem misbehaves with
# correlated loss (7.17), so delay jitter is uncorrelated too. The capability
# gate reads this value and checks the delay and its spread.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: "{{NAME}}"
  namespace: sentrix
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - sentrix
    labelSelectors:
      app: "{{SOURCE_SERVICE}}"
  delay:
    latency: "{{LATENCY}}"
    jitter: "{{JITTER}}"
    correlation: "0"
  direction: to
  target:
    mode: one
    selector:
      namespaces:
        - sentrix
      labelSelectors:
        app: "{{TARGET_SERVICE}}"
  externalTargets:
    - "{{TARGET_SERVICE_CLUSTER_IP}}"
  duration: "{{DURATION}}"
