# Linux (k3s) overlay: everything from deploy/online-boutique (OTLP env,
# resource limits, built-in loadgenerator at 0 replicas) plus a fixed NodePort
# for the frontend, so k6 reaches it without kubectl port-forward.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../online-boutique
patches:
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
        namespace: sentrix
      spec:
        type: NodePort
        ports:
          - name: http
            port: 80
            nodePort: 30080
# Mutable tag pinned (frozen 2026-10-23, SETUP-REVIEW 7.18): redis:alpine is
# re-pointed by every Redis release; this is the digest 206-40 ran during
# calibration (redis-cart pod imageID). Every other image is a fixed version.
images:
  - name: redis
    newTag: alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
