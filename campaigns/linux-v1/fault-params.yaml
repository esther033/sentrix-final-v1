# Fault and load parameters consumed by scripts/generate-campaign.py.
#
# status: draft  -> calibration-start values from campaign-plan.yaml. Profiles
#                   generated from a draft file are marked
#                   "calibration_status": "draft" and run-campaign.py refuses
#                   to execute them as the formal campaign.
# status: frozen -> set ONLY after the Linux capability + calibration runs
#                   (handoff/linux-v1/TEAMMATE-PROMPT.md section D). Record the
#                   calibration run IDs that justified each value. Never edit a
#                   frozen file mid-campaign; start a new campaign ID instead.
schema_version: 1
campaign_id: linux-v1
status: frozen
frozen_at: "2026-10-23T00:00:00+09:00"   # approved by the researcher 2026-10-22/23 (SETUP-REVIEW 7.16-7.18)
calibration_evidence:
  capacity:      # C = 6 tx/s: rate 4 p50/p99 35/129 ms, 6 133/326, 8 FAIL 545 (SETUP-REVIEW 7.13)
    result: runs/_calibration/capacity-merged-20261019/capacity-merged.json
    curve: linux/out/capacity-curve-20261019.csv
  capability:    # 206-40 gates (7.11, 7.15, 7.17, 7.18)
    - linux/out/capability-20261022T071229Z
    - linux/out/capability-network-20261023T053747Z
  cpu_saturation:    # worker 1 no impact (7.14); worker 4 / load 100 impacted (7.16)
    - calib-linux-v1-cpu-checkoutservice-r01
    - calib2-linux-v1-cpu-checkoutservice-r02
    - calib2-linux-v1-control-cpu-checkoutservice-r02
  pod_failure:       # impacted (7.14)
    - calib-linux-v1-pod-checkoutservice-r01
    - calib-linux-v1-control-pod-checkoutservice-r01
  network_delay:     # method A, +100 ms per call, impacted (7.16)
    - calib2-linux-v1-delay-front-product-r02
    - calib2-linux-v1-control-delay-front-product-r02
  packet_loss:       # correlation 25 dropped nothing (7.16, 7.17); correlation 0 drop 2.04 %, impacted (7.17)
    - calib2-linux-v1-loss-front-product-r02
    - calib3-linux-v1-loss-front-product-r02
    - calib3-linux-v1-control-loss-front-product-r02
  traffic_surge:     # levels from the capacity curve (7.15)
    - runs/_calibration/capacity-merged-20261019/capacity-merged.json

# Sustainable capacity C in user transactions/s (not HTTP RPS, not gRPC calls).
# Measured by linux/calibration/capacity-sweep.sh. null until measured.
capacity_tps: 6     # baseline 0.4C = 2.4 tx/s
load_fractions:
  baseline: 0.4
  # 2026-10-20 (SETUP-REVIEW 7.15): was 0.6 / 0.8 / 1.0. At C = 6 the capacity
  # curve gives p99 125-130 ms up to 4 tx/s and 326 ms at 6 tx/s, all under
  # 3 x baseline p99 (~360-384 ms), so 0.6C was a certain no-impact level and
  # 1.0C borderline. 4/3 C = 8 tx/s measured p99 545 ms (~4.3 x baseline).
  surge_levels:
    l1: 0.8
    l2: 1.0
    l3: 1.3333   # 4/3; tps() snaps 6 x 1.3333 to 8.0 tx/s

faults:
  cpu_saturation:
    template: deploy/chaos-mesh/faults/cpu-saturation.yaml
    params:             # r01 used workers=1 (no user impact, SETUP-REVIEW 7.14)
      WORKERS: 4
      LOAD: 100
  pod_failure:
    template: deploy/chaos-mesh/faults/pod-failure.yaml
    params: {}
  network_delay:
    template: deploy/chaos-mesh/faults/network-delay.yaml
    params:
      LATENCY: 100ms
      JITTER: 10ms
    template_fixed:     # in the template, not a parameter; tests check it (7.18)
      correlation: "0"
  packet_loss:
    template: deploy/chaos-mesh/faults/packet-loss.yaml
    params:
      LOSS_PERCENT: "2"
    template_fixed:     # kernel 7.0 netem drops ~nothing with correlation 25 (7.17)
      correlation: "0"
  traffic_surge:
    template: null
    params: {}

workload:
  time_unit: 1s
  pre_allocated_vus: 15
  max_vus: 80
  stage_timeout: 5s
  trace_workers: 2
