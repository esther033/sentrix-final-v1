# Overlay on deploy/loki/values-minimal.yaml (24h retention, 2Gi PVC).
# 206-40 (15 GiB RAM): retention 48h -> 12h, limit 2Gi -> 1Gi, PVC 15Gi.
loki:
  limits_config:
    retention_period: 12h
singleBinary:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 15Gi
    storageClass: local-path
# 206-40 memory reduction (approved 2026-10-16). Keys checked against the
# loki-7.3.0 chart: resultsCache is enabled by default and renders a memcached
# StatefulSet with request = limit = allocatedMemory*1.2 = 1229Mi; it only
# caches query results (chunksCache is already off for the same reason). With
# both caches off no memcached/memcached-exporter Pod is rendered. The rules
# sidecar (no resources set) only loads ruler ConfigMaps, which are unused.
resultsCache:
  enabled: false
sidecar:
  rules:
    enabled: false
# Mutable tag pinned (frozen 2026-10-23, SETUP-REVIEW 7.18): the chart's
# 1.29-alpine moves with nginx patch releases; this is the digest 206-40 ran
# during calibration (loki-gateway pod imageID).
gateway:
  # Recreate, not RollingUpdate: the chart's required pod anti-affinity keeps a
  # second gateway pod Pending on a single node, so a rolling update never ends
  # (helm --wait timed out on 2026-10-23, SETUP-REVIEW 7.18).
  deploymentStrategy:
    type: Recreate
  image:
    digest: sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
