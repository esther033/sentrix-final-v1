# Overlay on deploy/prometheus/values-minimal.yaml. Docker Desktop used
# emptyDir + 6h retention; an unattended campaign needs the raw window to
# survive a pod restart until export finishes (export deadline: 30 min after
# each run), so: PVC on k3s local-path + 48h retention.
server:
  retention: "48h"
  persistentVolume:
    enabled: true
    size: 40Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
