# Dedicated capability-probe workloads (TEAMMATE-PROMPT B.2, LINUX-DATA-COLLECTION-PLAN 3).
# Separate namespace: no qdisc or stress is ever applied to application pods
# or to the host while proving that the injectors work.
#   probe-src -> probe-dst : the edge under test
#   probe-src -> probe-other: must stay unaffected (filter scope)
#   probe-cpu              : 500m CPU limit, same as the app services
#   probe-dst / probe-other also serve HTTP on 8080 behind a ClusterIP Service of
#   the same name, so network.sh can test the Service path the app uses
#   (callers dial Service names; kube-proxy DNAT happens outside the pod).
apiVersion: v1
kind: Namespace
metadata:
  name: sentrix-probe
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: probe-src, namespace: sentrix-probe}
spec:
  replicas: 1
  selector: {matchLabels: {app: probe-src}}
  template:
    metadata: {labels: {app: probe-src}}
    spec:
      containers:
        - name: main
          image: __NETSHOOT__
          command: ["sleep", "infinity"]
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: probe-dst, namespace: sentrix-probe}
spec:
  replicas: 1
  selector: {matchLabels: {app: probe-dst}}
  template:
    metadata: {labels: {app: probe-dst}}
    spec:
      containers:
        - name: main
          image: __NETSHOOT__
          command: ["python3", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/tmp"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: probe-other, namespace: sentrix-probe}
spec:
  replicas: 1
  selector: {matchLabels: {app: probe-other}}
  template:
    metadata: {labels: {app: probe-other}}
    spec:
      containers:
        - name: main
          image: __NETSHOOT__
          command: ["python3", "-m", "http.server", "8080", "--bind", "0.0.0.0", "--directory", "/tmp"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
          resources: {requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: probe-cpu, namespace: sentrix-probe}
spec:
  replicas: 1
  selector: {matchLabels: {app: probe-cpu}}
  template:
    metadata: {labels: {app: probe-cpu}}
    spec:
      containers:
        - name: main
          image: __BUSYBOX__
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          readinessProbe:
            exec: {command: ["true"]}
            periodSeconds: 2
          resources: {requests: {cpu: 100m, memory: 32Mi}, limits: {cpu: 500m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: probe-dst, namespace: sentrix-probe}
spec:
  selector: {app: probe-dst}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: probe-other, namespace: sentrix-probe}
spec:
  selector: {app: probe-other}
  ports: [{port: 8080, targetPort: 8080}]
